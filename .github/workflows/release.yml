name: Release

on:
  workflow_dispatch:
  
jobs:
  buildluna:
    uses: ./.github/workflows/buildluna.yml
    # with: 
    #   createrelease: true
    secrets: inherit
  
  signandrepack:
    runs-on: windows-latest
    needs: [buildluna]
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
            path: build
      - run: python src/scripts/build_lunatranslator.py exedlls

      - uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: exedlls
          path: collect

      - name: Wait for artifact to be listed
        # SignPath 按 artifact id 在 run 的 artifact 列表里查找；刚上传完的
        # artifact 有短暂传播延迟，立刻提交会报 "no published artifact"。
        # 等它出现在列表里再提交（每 3 秒查一次，最多 2 分钟）。
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-artifact.outputs.artifact-id }}
        run: |
          for ($i = 0; $i -lt 40; $i++) {
            $ids = @(gh api "repos/$Env:GITHUB_REPOSITORY/actions/runs/$Env:GITHUB_RUN_ID/artifacts" --jq ".artifacts[].id")
            if ($ids -contains "$Env:ARTIFACT_ID") {
              Write-Host "artifact $Env:ARTIFACT_ID listed"
              exit 0
            }
            Start-Sleep -Seconds 3
          }
          Write-Error "artifact $Env:ARTIFACT_ID not listed after 2 minutes"
          exit 1
  
      - uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_APITOKEN }}'
          organization-id: '2e2b9c90-04bb-4b70-8562-0171927d94c6'
          project-slug: 'LunaTranslator'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed_exedlls'
          artifact-configuration-slug: 'exedlls'

      - uses: actions/upload-artifact@v7
        with:
          name: signed_exedlls
          path: signed_exedlls

      - run: python src/scripts/build_lunatranslator.py repack

      - uses: actions/upload-artifact@v7
        with:
          name: signed
          path: signed

  loadversion:
    # if: ${{inputs.createrelease}}
    runs-on: windows-latest
    outputs:
      version: ${{ steps.loadversion.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: loadversion
        run: python src/scripts/build_lunatranslator.py loadversion | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

  release:
    runs-on: windows-latest
    needs: [signandrepack,loadversion]
    steps:
      - uses: actions/download-artifact@v8
        with:
            path: build
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.loadversion.outputs.version }}
          files: |
            build/signed/LunaTranslator_x86_winxp.zip
            build/signed/LunaTranslator_x64_win7.zip
            build/signed/LunaTranslator_x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: curl https://lunatranslator.org/${{ secrets.LUNA_UPDATE_NOTIFY }}
